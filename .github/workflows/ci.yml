name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: The binary answers at all
        run: |
          ./target/release/sriov-mac-sync --version
          ./target/release/sriov-mac-sync --help

  msrv:
    # Cargo.toml claims a minimum Rust version. Claiming is not testing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.74 --profile minimal
      - run: cargo +1.74 test

  integration:
    # The tests above drive the code against a fake socket. This drives the
    # built binary against the kernel itself - a bridge and veth pairs in a
    # throwaway network namespace, real netlink, real /sys - and holds every
    # mode to its promise. The runner grants root via sudo and ships
    # iproute2; the script refuses politely anywhere it might collide with a
    # real daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release build
        run: cargo build --release
      - name: Against a real kernel
        run: sudo bench/integration.sh target/release/sriov-mac-sync

  packages:
    # The audience runs hypervisors and routers, not build hosts. Everything a
    # release ships is built and then actually exercised here: the binaries
    # must not depend on the build machine's C library, the .deb must install
    # and purge on a real dpkg, the .ipk must have the member order opkg
    # expects, and the aarch64 binary must run - under emulation, but run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cross targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: apk-tools, for the OpenWrt v3 package
        # OpenWrt's own apk can only install; building a package needs the
        # full apk-tools, and no distribution ships version 3 yet.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y meson ninja-build libssl-dev zlib1g-dev fakeroot
          git clone -q --depth 1 https://gitlab.alpinelinux.org/alpine/apk-tools.git /tmp/apk-tools
          meson setup /tmp/apk-tools/build /tmp/apk-tools -Dprefix=/usr >/dev/null
          ninja -C /tmp/apk-tools/build >/dev/null
          /tmp/apk-tools/build/src/apk --version
      - name: Build the artefacts
        run: APK=/tmp/apk-tools/build/src/apk ./dist/package.sh
      - name: Both binaries are static
        run: |
          for a in x86_64 aarch64; do
            file "dist/out/sriov-mac-sync-$a"
            ! ldd "dist/out/sriov-mac-sync-$a" 2>/dev/null | grep -q "=>" \
              || (echo "$a binary still has dynamic dependencies" && exit 1)
          done
      - name: The aarch64 binary runs
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y qemu-user-static
          qemu-aarch64-static dist/out/sriov-mac-sync-aarch64 --version
          qemu-aarch64-static dist/out/sriov-mac-sync-aarch64 --help > /dev/null
      - name: The .deb installs, works and purges
        run: |
          sudo dpkg -i dist/out/sriov-mac-sync_*_amd64.deb
          test -x /usr/sbin/sriov-mac-sync
          /usr/sbin/sriov-mac-sync --version
          grep -q "^ExecStart=/usr/sbin/sriov-mac-sync$" \
            /usr/lib/systemd/system/sriov-mac-sync.service
          sudo dpkg --purge sriov-mac-sync
          ! test -e /usr/sbin/sriov-mac-sync
          ! test -e /etc/sriov-mac-sync.conf
      - name: The .ipk is one opkg would take
        run: |
          for f in dist/out/*.ipk; do
            test "$(ar t "$f" | tr '\n' ' ')" = "debian-binary control.tar.gz data.tar.gz " \
              || (echo "$f: wrong member order" && exit 1)
            test "$(ar p "$f" debian-binary)" = "2.0"
            ar p "$f" data.tar.gz | tar tzf - | grep -q "./etc/init.d/sriov-mac-sync"
            ar p "$f" control.tar.gz | tar xzOf - ./control | grep -q "^Package: sriov-mac-sync$"
          done
      - name: The .apk is one OpenWrt would take
        run: |
          for f in dist/out/*.apk; do
            test -s "$f" || (echo "$f is empty" && exit 1)
          done
          # Ownership is the part that goes wrong silently: apk records what it
          # finds on disk, and files owned by the builder install as nobody.
          /tmp/apk-tools/build/src/apk extract --allow-untrusted \
            --destination /tmp/apkcheck dist/out/sriov-mac-sync-*-x86_64.apk
          test -x /tmp/apkcheck/usr/sbin/sriov-mac-sync
          test -x /tmp/apkcheck/etc/init.d/sriov-mac-sync
      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: dist/out/
