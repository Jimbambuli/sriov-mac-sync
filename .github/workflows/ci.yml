name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
      - name: The binary answers at all
        run: |
          ./target/release/sriov-mac-sync --version
          ./target/release/sriov-mac-sync --help

  msrv:
    # Cargo.toml claims a minimum Rust version. Claiming is not testing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.74 --profile minimal
      - run: cargo +1.74 test --locked

  integration:
    # The tests above drive the code against a fake socket. This drives the
    # built binary against the kernel itself - a bridge and veth pairs in a
    # throwaway network namespace, real netlink, real /sys - and holds every
    # mode to its promise. The runner grants root via sudo and ships
    # iproute2; the script refuses politely anywhere it might collide with a
    # real daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release build
        run: cargo build --locked --release
      - name: Against a real kernel
        run: sudo bench/integration.sh target/release/sriov-mac-sync

  packages:
    # The audience runs hypervisors and routers, not build hosts. Everything a
    # release ships is built and then actually exercised here: the binaries
    # must not depend on the build machine's C library, the .deb must install
    # and purge on a real dpkg, the .ipk must have the member order opkg
    # expects, and the aarch64 binary must run - under emulation, but run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cross targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: apk-tools, for the OpenWrt v3 package
        # OpenWrt's own apk can only install; building a package needs the
        # full apk-tools, and no distribution ships version 3 yet.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y meson ninja-build libssl-dev zlib1g-dev fakeroot groff
          # The GitHub mirror, not gitlab.alpinelinux.org: the runner reaches
          # the former reliably and the latter sometimes not at all (exit 128,
          # twice). Retried anyway, because one clone is one thing that can go
          # wrong in every run. Pinned to a release tag: a master that renames
          # a meson option or changes the mkpkg CLI must not decide whether
          # this repository's CI is green.
          for i in 1 2 3; do
            git clone -q --depth 1 --branch v3.0.7 https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools && break
            echo "clone attempt $i failed"; rm -rf /tmp/apk-tools; sleep 5
          done
          test -d /tmp/apk-tools/src
          meson setup /tmp/apk-tools/build /tmp/apk-tools -Dprefix=/usr >/dev/null
          ninja -C /tmp/apk-tools/build >/dev/null
          /tmp/apk-tools/build/src/apk --version
      - name: Build the artefacts
        run: APK=/tmp/apk-tools/build/src/apk ./dist/package.sh
      - name: The shell in this repository is checked
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y shellcheck
          # Of these three, only the OpenWrt init script is shipped to
          # anybody; package.sh and the harness run here and on a
          # maintainer's machine. The eight maintainer scripts INSIDE
          # package.sh - postinst, prerm and their .ipk and .apk twins - are
          # quoted here-documents, so shellcheck sees data, not code. What
          # covers those is the install/upgrade/remove run in the .deb step
          # and the grep assertions in the package step.
          shellcheck -S warning dist/package.sh bench/integration.sh \
            dist/openwrt/sriov-mac-sync.init

      - name: Both binaries are static
        run: |
          # readelf, not ldd: an x86 ldd prints no "=>" line for an aarch64
          # file whatever it is linked against, so the aarch64 half of this
          # check could not fail. A PT_INTERP segment is the fact - a
          # static binary has none.
          for a in x86_64 aarch64; do
            file "dist/out/sriov-mac-sync-$a"
            ! readelf -l "dist/out/sriov-mac-sync-$a" | grep -q INTERP \
              || (echo "$a binary still has a dynamic loader" && exit 1)
          done
      - name: The aarch64 binary runs
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y qemu-user-static
          qemu-aarch64-static dist/out/sriov-mac-sync-aarch64 --version
          qemu-aarch64-static dist/out/sriov-mac-sync-aarch64 --help > /dev/null
      - name: The .deb installs, works and purges
        run: |
          set -x
          sudo dpkg -i dist/out/sriov-mac-sync_amd64.deb
          test -x /usr/sbin/sriov-mac-sync
          /usr/sbin/sriov-mac-sync --version
          grep -q "^ExecStart=/usr/sbin/sriov-mac-sync$" \
            /usr/lib/systemd/system/sriov-mac-sync.service
          # A manual page that does not render is worse than none: it is only
          # ever read on a machine where nobody can check it against anything.
          test -f /usr/share/man/man8/sriov-mac-sync.8.gz
          zcat /usr/share/man/man8/sriov-mac-sync.8.gz > /tmp/page.8
          warnings=$(groff -man -Tutf8 /tmp/page.8 2>&1 >/dev/null || true)
          if [ -n "$warnings" ]; then echo "$warnings"; exit 1; fi
          # The header line, not a sentence: man wraps its text at whatever
          # width it guesses, and a phrase that fits here breaks in half there.
          MANWIDTH=200 man -l /tmp/page.8 | grep -q "^SRIOV-MAC-SYNC(8)"
          # Installing a service on Debian means enabling it. Whether it also
          # came up is not asserted: a runner is not a machine where a daemon
          # that programs a NIC has anything to do, and policy-rc.d is allowed
          # to stop it.
          test "$(systemctl is-enabled sriov-mac-sync)" = enabled
          # The removal path has the same refusal the .ipk one carries, for
          # the same reason: `deb-systemd-invoke stop` exits 0 without
          # stopping anything when a policy-rc.d forbids it.
          dpkg -e dist/out/sriov-mac-sync_amd64.deb /tmp/debctl
          grep -q "not flushing" /tmp/debctl/prerm \
            || (echo ".deb prerm flushes without checking the daemon is down" && exit 1)
          systemctl is-active sriov-mac-sync || echo "(not running here, fine)"
          # And the same for the .deb: the control file's Architecture
          # against the ELF machine of the binary it carries.
          debarch=$(dpkg-deb -f dist/out/sriov-mac-sync_amd64.deb Architecture)
          dpkg-deb --fsys-tarfile dist/out/sriov-mac-sync_amd64.deb \
            | tar xOf - ./usr/sbin/sriov-mac-sync > /tmp/debbin
          debmachine=$(readelf -h /tmp/debbin | sed -n 's/.*Machine: *//p')
          case "$debarch:$debmachine" in
            amd64:*X86-64*|arm64:*AArch64*) ;;
            *) echo ".deb declares $debarch but carries a $debmachine binary"; exit 1 ;;
          esac
          # The upgrade path the quiet-keep memory exists for: installing
          # the same .deb again runs old-prerm "upgrade" + postinst with
          # $2 set - the state directory must survive it and the unit must
          # come back enabled.
          sudo touch /run/sriov-mac-sync/canary
          # The whole reason the postinst exists: `start` on a running unit
          # is a no-op, so an upgrade without a restart leaves the OLD
          # binary running until reboot. The process id either side says
          # whether it really came back on the new one. Only when it was
          # running at all - a runner under policy-rc.d may have none.
          before=$(systemctl show -p MainPID --value sriov-mac-sync)
          sudo dpkg -i dist/out/sriov-mac-sync_amd64.deb
          after=$(systemctl show -p MainPID --value sriov-mac-sync)
          if [ "$before" != 0 ] && [ "$before" = "$after" ]; then
            echo "the upgrade did not restart the daemon (pid $before)"; exit 1
          fi
          # sudo, because the state directory is 0700 root - an
          # unprivileged test -e reads "denied" as "gone" and cried wolf.
          if ! sudo test -e /run/sriov-mac-sync/canary; then
            echo "the upgrade cleared the state directory"; exit 1
          fi
          test "$(systemctl is-enabled sriov-mac-sync)" = enabled
          # The unit that would actually run is the packaged one, not a
          # leftover in /etc that would shadow it.
          test "$(systemctl show -p FragmentPath --value sriov-mac-sync)" \
            = /usr/lib/systemd/system/sriov-mac-sync.service
          sudo dpkg --purge sriov-mac-sync
          # Not `! test -e`: errexit exempts !-pipelines, and a leftover
          # would have sailed through green.
          if test -e /usr/sbin/sriov-mac-sync; then
            echo "purge left the binary behind"; exit 1
          fi
          if test -e /etc/sriov-mac-sync.conf; then
            echo "purge left the conffile behind"; exit 1
          fi
          if systemctl is-enabled sriov-mac-sync 2>/dev/null; then
            echo "purge left the unit enabled"; exit 1
          fi
      - name: The .ipk is one opkg would take
        run: |
          for f in dist/out/*.ipk; do
            test "$(ar t "$f" | tr '\n' ' ')" = "debian-binary control.tar.gz data.tar.gz " \
              || (echo "$f: wrong member order" && exit 1)
            test "$(ar p "$f" debian-binary)" = "2.0"
            ar p "$f" data.tar.gz | tar tzf - | grep -q "./etc/init.d/sriov-mac-sync"
            ar p "$f" control.tar.gz | tar xzOf - ./control | grep -q "^Package: sriov-mac-sync$"
            # procd's `start` compares the instance definition, not the
            # binary, so without this restart an upgrade leaves the OLD
            # daemon running until reboot. Nothing but this asserts it.
            ar p "$f" control.tar.gz | tar xzOf - ./postinst | grep -q PKG_UPGRADE \
              || (echo "$f: postinst does not restart on upgrade" && exit 1)
            # And the removal path must refuse to flush past a daemon that
            # did not stop - a live one puts the entries straight back.
            ar p "$f" control.tar.gz | tar xzOf - ./prerm | grep -q "not flushing" \
              || (echo "$f: prerm flushes without checking the daemon is down" && exit 1)
            # An upgrade must not start a daemon the operator stopped.
            ar p "$f" control.tar.gz | tar xzOf - ./postinst | grep -q "left stopped" \
              || (echo "$f: postinst restarts unconditionally on upgrade" && exit 1)
            # The binary inside has to be the architecture the control file
            # declares. A transposed suffix in package.sh's argument lists
            # would ship the x86_64 binary as aarch64_generic, and the
            # audience runs routers, where that is a brick.
            arch=$(ar p "$f" control.tar.gz | tar xzOf - ./control \
              | sed -n 's/^Architecture: //p')
            ar p "$f" data.tar.gz | tar xzOf - ./usr/sbin/sriov-mac-sync > /tmp/pkgbin
            machine=$(readelf -h /tmp/pkgbin | sed -n 's/.*Machine: *//p')
            case "$arch:$machine" in
              x86_64:*X86-64*|aarch64_generic:*AArch64*) ;;
              *) echo "$f: declares $arch but carries a $machine binary"; exit 1 ;;
            esac
          done
      - name: The .apk is one OpenWrt would take
        run: |
          APK=/tmp/apk-tools/build/src/apk
          mkdir -p /tmp/apkcheck
          $APK extract --allow-untrusted --destination /tmp/apkcheck \
            dist/out/sriov-mac-sync_x86_64.apk
          test -x /tmp/apkcheck/usr/sbin/sriov-mac-sync
          test -x /tmp/apkcheck/etc/init.d/sriov-mac-sync
          # Ownership is what goes wrong silently: apk records what it finds on
          # disk, so a package built without fakeroot installs as nobody. It has
          # to be read from the metadata - extracting as a normal user cannot
          # preserve it, which is why checking the extracted tree proves
          # nothing.
          # Captured, not piped: a pipeline whose first grep matches nothing
          # returns 1 and the loop happily calls that "all root" - a dump
          # that failed outright then reads as a pass. The assignment lets
          # errexit kill the step instead, and the count proves the dump
          # said anything at all.
          for f in dist/out/*.apk; do
            dump=$($APK adbdump "$f")
            owners=$(printf '%s\n' "$dump" | grep -cE "^ +(user|group): " || true)
            if [ "$owners" -eq 0 ]; then
              echo "$f: adbdump named no owners at all"
              exit 1
            fi
            if printf '%s\n' "$dump" | grep -E "^ +(user|group): " | grep -qv ": root$"; then
              echo "$f: something in there is not owned by root"
              exit 1
            fi
            # The upgrade mechanism each package carries is the thing that
            # keeps the quiet-keep memory alive across an update; nothing
            # else asserts it exists.
            printf '%s\n' "$dump" | grep -q "post-upgrade" || {
              echo "$f: no post-upgrade script - an upgrade would leave the old daemon"
              exit 1
            }
          done
          echo "every file in every .apk is owned by root, and each carries post-upgrade"
      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: dist/out/
